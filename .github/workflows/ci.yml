name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install "conan==2.32.0"
      - run: python -m unittest discover -s tests -v
      - run: chmod +x scripts/demo.sh && ./scripts/demo.sh
      - run: |
          test -s demo/assurance.json
          test -s demo/assurance.ndjson
          grep -q '"reference":"zlib/1.3.1"' demo/assurance.ndjson
          grep -q '"check":"source-digest"' demo/assurance.ndjson
          grep -q '"check":"openssf-scorecard"' demo/assurance.ndjson
          grep -q '"status":"PASS"' demo/assurance.ndjson
